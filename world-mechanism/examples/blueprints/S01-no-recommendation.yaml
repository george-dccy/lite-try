id: S01-no-recommendation
version: "0.4"
status: approved

source_domain:
  - technology
  - society
  - contemporary

cultural_lens:
  primary_context: "Chinese-language everyday internet experience"
  secondary_context:
    - "YouTube"
    - "Netflix"
    - "Google Research"
  why_this_context: "主文不依赖外国平台人物或制度，使用中文读者熟悉的‘短视频/内容平台首页’作为日常入口；海外公开资料只用于验证推荐、订阅、搜索和多参与者机制。"
  avoid_default_foreign_case: true

question:
  surface: "如果推荐算法消失七天，互联网会不会更真实？"
  core: "拿走个性化预测排序以后，注意力分配权和寻找成本会转移到哪里？"
  why_i_care: "它把‘算法好不好’改写成更底层的‘谁替我筛、按什么目标筛、我能否控制这套筛法’。"

mechanism:
  one_sentence_model: "内容越过剩，排序越不可避免；取消个性化推荐不会消除中介，只会让别的中介接管首页，并重新分配寻找成本、曝光机会和控制权。"
  actors:
    - "用户"
    - "创作者"
    - "平台"
    - "广告主与商家"
    - "编辑、搜索、社交网络等替代中介"
  forces:
    - "注意力稀缺"
    - "内容供给过剩"
    - "搜索成本"
    - "首次曝光稀缺"
    - "多方目标与激励"
  feedback_loops:
    - "展示 -> 互动 -> 数据 -> 后续展示机会"
    - "分配规则 -> 创作者适应 -> 内容供给变化 -> 新的分配结果"
  evidence_status:
    facts:
      - "现实大型内容产品会并存多种发现机制，例如个性化首页、订阅、搜索。"
      - "推荐系统可以在特定任务中降低寻找成本。"
      - "现代推荐生态包含用户、内容提供者、广告商等多个参与者。"
      - "推荐系统研究会讨论准确度、多样性、新颖性和偶遇性等多个维度。"
    interpretations:
      - "无个性化推荐不等于无排序。"
      - "不同替代排序规则会重新分配搜索成本、曝光机会和控制权。"
    hypotheses:
      - "创作者会根据替代规则调整发布时间、标题或外部社群策略。"
      - "用户对控制感与搜索成本的感受会因使用习惯而不同。"

creative_hypothesis:
  operation: "Remove + Reader Choice"
  entry_point: "首页只有十把椅子，个性化推荐被拿走以后由谁坐？"
  surprise_source: "每个看似更自由的替代方案都会产生新的中介、成本和盲点。"
  changed_rule: "先拿走首页个性化预测排序，再让读者依次选择时间顺序、订阅、搜索、人工精选、热门榜等替代机制。"
  why_this_reveals_the_mechanism: "读者亲手更换排序规则，自己观察注意力分配权和成本如何迁移，而不是被作者直接告知结论。"
  first_association_rejected:
    - "算法让人上瘾"
    - "信息茧房"
    - "算法比你更懂你"
    - "关掉算法就会更真实"

world:
  rule: "这是思想实验，不是现实平台预测。"
  invariant: "每一轮必须明确谁在排序，不能出现‘没有规则的首页’。"
  forbidden_shortcuts:
    - "不把时间顺序描述成中性"
    - "不默认算法等于操控"
    - "不把人工编辑描述成无偏见"
    - "不把假设行为写成已发生事实"

human_stakes:
  ordinary_life_change: "用户承担不同寻找成本；创作者面对不同首次曝光路径；平台把控制权放在不同机制上。"
  who_adapts_first: "已有强订阅关系、明确搜索意图或外部社群的人。"
  who_pays_cost: "没有明确搜索词的新用户、依赖平台发现的新内容，以及不愿投入寻找时间的人。"

content_progression:
  - "首页只有十把椅子，个性化推荐被拿走"
  - "选择时间顺序：频率和发布时间成为新规则"
  - "选择只看关注：过去的选择影响未来发现"
  - "选择搜索：已知需求变强，未知兴趣变弱"
  - "选择人工编辑：判断更可见，但中介仍存在"
  - "选择热门榜：集体行为形成新的反馈回路"
  - "现实检查：真实产品本来就在混用多种发现机制"
  - "问题升级：不是要不要中介，而是谁筛、按什么目标筛、能否切换"

knowledge_payload:
  child_layer:
    - "东西太多时，总要有一种规则决定先看什么。"
    - "按时间、按热门、老师挑、机器推荐，都是不同的排序办法。"
    - "自己选择也常常需要花更多时间寻找。"
  adult_layer:
    - "核心不是有没有中介，而是中介是谁、优化什么、是否透明和可控。"
    - "效率、控制感、多样性、偶遇和生态激励可能互相冲突。"
    - "取消一种分配机制通常意味着另一种机制接管。"
  optional_afterword:
    - "解释cold-start、exploration、diversity、serendipity。"

expression:
  primary_mode: "interactive-essay-explainer"
  renderer_candidates:
    - "article"
    - "interactive-web"
    - "whiteboard"
    - "minimal-line"
    - "hybrid"
  content_master: "content-masters/S01-homepage-ten-chairs.md"
  draft: "drafts/S01-homepage-ten-chairs-article.md"
  evidence_pack: "examples/evidence-packs/S01-pass-b.yaml"
  must_preserve:
    - "首页十把椅子作为稀缺注意力的核心隐喻"
    - "只取消个性化预测排序，而非所有算法"
    - "无推荐不等于无排序"
    - "user / creator / platform至少三方视角"
    - "事实与反事实分层"
    - "不做算法善恶总裁决"
    - "让读者经历推理，而不是作者提前宣布机制"
  may_change:
    - "椅子数量"
    - "平台例子"
    - "是否最终实现互动网页"
    - "媒介长度"

creator_notes:
  what_surprised_me: "‘自己选择’并不是没有中介，它通常只是把筛选成本和权力转移到别处。"
  what_i_am_not_sure_about: "正式发布时是否需要加入中国平台的可核实公开案例；如果加入，必须单独研究。"
  what_i_refuse_to_simplify: "不把问题写成‘算法控制我们’或‘算法只是提高效率’。"
  human_feedback: "文章内容被明确评价为惊艳、符合作者气质、让人想跟着思路读下去，可照此推进。"
