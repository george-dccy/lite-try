id: H01-standard-time
version: "0.4"
status: review

source_domain:
  - history
  - science
  - technology
  - society

cultural_lens:
  primary_context: "China"
  secondary_context:
    - "global time standards"
  why_this_context: "中国自身拥有从观象授时、历法到现代原子时和北斗授时的连续历史纵深；北京时间由西安国家授时中心产生这一真实反差，比外国铁路案例更直接暴露标准时间作为公共基础设施的本质。"
  avoid_default_foreign_case: true

question:
  surface: "北京时间为什么是在西安产生的？"
  core: "一个国家怎样让亿万人和不同系统共享同一个未来时间坐标？"
  why_i_care: "我们每天把北京时间当自然事实，但它其实需要一整套产生、保持、校准和传播时间的基础设施。"

mechanism:
  one_sentence_model: "标准时间不只是测出‘现在’，而是通过可信的授时基础设施，让整个社会共享同一条可用于协调未来的时间轴。"
  actors:
    - "普通人"
    - "交通、通信、金融、电力与导航系统"
    - "中国科学院国家授时中心"
    - "国内守时与授时网络"
    - "国际时间体系"
  forces:
    - "跨地域协作"
    - "时间同步精度需求"
    - "标准的网络效应"
    - "可靠时间产生、保持和传播"
  feedback_loops:
    - "社会系统越依赖同步 -> 时间标准要求越高 -> 授时基础设施越重要 -> 更多系统建立在统一时间上"
  evidence_status:
    facts:
      - "中国科学院国家授时中心承担国家标准时间（北京时间）的产生、保持和发播任务，总部位于陕西西安临潼。"
      - "北京时间采用东八区标准时间，标准经线为东经120°；北京当地经度约东经116°，因此北京时间不等同于北京地方太阳时。"
      - "中国传统天文学存在长期的观象授时、历法计时与定时授时实践。"
      - "1949年后‘北京时间’名称通过广播出现并逐步推广。"
      - "现代国家标准时间通过原子钟组、长短波、卫星导航等体系产生、保持和发播。"
    interpretations:
      - "‘授时’可以被理解为把时间从测量结果变成社会可共同使用的公共坐标。"
      - "标准时间是基础设施而不仅是钟表读数。"
    hypotheses:
      - "‘北京时间为什么在西安产生’比交通时刻表更能让当代中文读者产生真实认知惊讶。"

creative_hypothesis:
  operation: "Truth Surprise + Historical Depth"
  entry_point: "北京时间为什么从西安发出？"
  surprise_source: "真实事实反差，而非虚构事故"
  changed_rule: "不新增世界规则；逐层拿掉‘北京时间就是北京当地时间’这一默认直觉。"
  why_this_reveals_the_mechanism: "当观众发现标准时间既不从北京太阳直接读出，也不必须在北京产生，就会自然追问：时间标准究竟是什么、谁来产生、如何让全国共同使用。"
  first_association_rejected:
    - "火车时刻表"
    - "航班"
    - "跨时区会议"
    - "美国铁路标准时间史"

world:
  rule: "真实世界，不添加虚构规则。"
  invariant: "古代授时与现代标准时间只做机制连续性对照，不能写成同一种技术。"
  forbidden_shortcuts:
    - "不说古代中国已经实现全国统一精确时钟"
    - "不说每台手机都直接从西安接收时间"
    - "不把北京时间名称理解成北京地方太阳时"
    - "不把美国案例重新放回主叙事"

content_progression:
  - "北京时间为什么不是从北京产生"
  - "它甚至不是北京当地太阳的时间"
  - "标准时间究竟是什么"
  - "中国传统观象授时：时间为何需要成为共同秩序"
  - "现代社会从‘看天’走向原子钟和高精度同步"
  - "西安国家授时中心如何产生、保持和发播国家标准时间"
  - "重新理解北京时间：一条被共同维护的国家时间轴"

knowledge_payload:
  child_layer:
    - "北京时间是在西安的国家授时中心产生和保持的。"
    - "标准时间不是某个城市单独看太阳得到的。"
    - "现代交通、通信和导航需要很多机器认同同一个时间。"
  adult_layer:
    - "标准是一种看不见的公共基础设施。"
    - "中国‘授时’问题从传统历法秩序延伸到现代高精度时频体系。"
    - "统一时间同时是技术问题、协同问题和共同体秩序问题。"
  optional_afterword:
    - "补充东经120°、北京地方太阳时、UTC(NTSC)、原子钟和北斗授时的区别。"

expression:
  primary_mode: "china-first-curiosity-explainer"
  renderer_candidates:
    - "article"
    - "hybrid-video"
    - "whiteboard"
    - "archive-collage"
  must_preserve:
    - "中国视角为主"
    - "北京时间在西安产生这一真实入口"
    - "共享未来坐标 + 授时基础设施双层机制"
    - "古代与现代技术不混同"
    - "世界材料只做对照"
  may_change:
    - "是否从广播报时或手机时钟开场"
    - "古代历史具体选宋代还是元代"
    - "现代应用案例数量"

creator_notes:
  what_surprised_me: "时间并不是只要造一块足够准的钟就结束了；要让社会共享时间，还必须持续守时和授时。"
  what_i_am_not_sure_about: "如何把古代授时讲得有历史感但不过度类比现代标准时间。"
  what_i_refuse_to_simplify: "不再用美国铁路史或普通车票作为主入口。"
