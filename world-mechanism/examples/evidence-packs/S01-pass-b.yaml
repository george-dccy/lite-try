evidence_gaps:
  - "缺少公开、可直接外推到中国主流内容平台的同等透明排序机制资料。"
  - "‘关闭个性化推荐后的行为变化’仍属于思想实验，文章不得写成已证实结果。"
  - "如正式发布并点名具体中国平台，需要单独做平台级Pass B。"

mechanism_correction: "证据支持‘多种发现机制并存、推荐能降低部分寻找成本、生态含多参与者’；但不支持对关闭个性化推荐后的现实行为作确定预测，因此文章继续采用逐规则思想实验而不是经验性结论。"
do_not_strengthen:
  - "不要把YouTube机制当成所有平台通用实现。"
  - "不要把推荐系统目标简化为只追求观看时长。"
  - "不要把人工编辑、时间顺序或搜索写成无中介状态。"
  - "不要把思想实验分支写成实证结果。"
