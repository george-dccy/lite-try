evidence_gaps:
  - "1949—1950年各地区采用北京时间的精确时间线，如进入正文需继续Pass B。"
  - "古代‘授时’只做机制纵深，需避免与现代统一标准时间同义化。"
  - "终端设备如何从通信网络、卫星导航、NTP等链路获得可溯源时间，需要按具体应用再研究。"

mechanism_correction: "H01从‘铁路推动标准时间’升级为‘标准时间是一套把共同未来坐标产生、保持、校准并传播给社会的基础设施’，中国历史与现代国家授时体系成为主叙事。"
do_not_strengthen:
  - "不要说北京时间是北京当地太阳时。"
  - "不要说每台手机直接连接国家授时中心。"
  - "不要把古代授时等同于现代原子时或全国秒级同步。"
