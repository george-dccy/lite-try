id: H01-pass-a
mode: pass-a
checked_at: "2026-10-01"
scope:
  geography: "China"
  period: "traditional timekeeping to contemporary national standard time"
status: partially-supported
premise: "北京时间就是北京当地的太阳时间，而且应该由北京产生。"

claims:
  - claim_id: H01-F01
    claim: "中国科学院国家授时中心承担国家标准时间（北京时间）的产生、保持和发播任务，总部位于陕西省西安市临潼区。"
    label: F
    confidence: high
    source_ids: [S1]
    allowed_wording: "我国国家标准时间（北京时间）由位于西安临潼的中国科学院国家授时中心承担产生、保持和发播任务。"
    do_not_strengthen_to: "全国所有手机都直接从西安接收时间。"

  - claim_id: H01-F02
    claim: "北京时间采用东八区标准时间，对应东经120°标准经线，并不等同于北京当地的地方平太阳时。"
    label: F
    confidence: high
    source_ids: [S2]
    allowed_wording: "北京时间对应东八区标准时间，并非北京当地太阳时。"
    do_not_strengthen_to: "北京时间和北京没有关系。"

  - claim_id: H01-F03
    claim: "1949年9月28日，北京新华广播电台开始播报‘北京时间’，之后多地逐步采用。"
    label: F
    confidence: medium
    source_ids: [S3]
    allowed_wording: "国家授时中心的历史资料记载，1949年9月28日北京新华广播电台开始使用‘北京时间’播报。"
    do_not_strengthen_to: "1949年9月28日全国在同一瞬间统一改用北京时间。"

  - claim_id: H01-F04
    claim: "中国传统时间体系长期存在观象、历法和授时实践；宋代已有观象测时、定时授时与历法计时构成的完整时间系统。"
    label: F
    confidence: high
    source_ids: [S4, S5]
    allowed_wording: "中国传统天文学长期重视观象授时，宋代已形成完整的时间测量与授时体系。"
    do_not_strengthen_to: "古代中国已经实现现代意义上的全国统一标准时和秒级同步。"

  - claim_id: H01-F05
    claim: "20世纪60年代我国因战略和航天等高精度授时需求在陕西建设专门授时体系，关中位置有利于无线电信号覆盖。"
    label: F
    confidence: high
    source_ids: [S6]
    allowed_wording: "上世纪60年代，因国家战略和航天等高精度授时需求，我国在陕西关中建设专门授时台，地理位置也有利于无线电授时覆盖。"
    do_not_strengthen_to: "国家授时中心设在西安只是因为西安位于中国地理中心。"

  - claim_id: H01-I01
    claim: "标准时间是一项公共基础设施：它把时间测量结果转化为社会可共同使用、可追溯的时间坐标。"
    label: I
    confidence: high
    source_ids: [S1, S7]
    allowed_wording: "可以把现代标准时间理解为一种支撑交通、通信、导航、科研等系统协同的基础设施。"
    do_not_strengthen_to: "统一时间只有国家治理功能。"

