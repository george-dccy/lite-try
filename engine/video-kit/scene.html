<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// ---------- 1. 规格与 cue sheet（由 render.cjs 注入 window.CUES，与 audio.py 读同一份 cues.json）----------
const C = window.CUES, W = C.width, H = C.height, E = C.ev;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H;   // 运动模糊累积层
const ag = acc.getContext('2d');

// ---------- 2. 工具：种子随机、缓动、弹簧（全部是 t 的纯函数）----------
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);   // 过冲
function spring(t, f = 3.2, z = 0.32){ if (t <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }   // 闭式阻尼弹簧，0→1

// ---------- 3. 运动：球受重力下落 → 冲击挤压 → 两次衰减弹跳 → 回稳 ----------
const FLOOR = H * 0.72, R = 46, X0 = W * 0.5;
function ball(t){
  const t0 = E.drop, t1 = E.impact, y0 = -R * 2;
  const gpx = 2 * (FLOOR - R - y0) / Math.pow(t1 - t0, 2);           // 由落地时刻反解重力，保证命中 cue
  if (t < t0) return { y: y0, vy: 0, sq: 0 };
  if (t < t1) { const dt = t - t0; return { y: y0 + .5 * gpx * dt * dt, vy: gpx * dt, sq: 0 }; }
  const v1 = gpx * (t1 - t0); let v = v1 * 0.45, ts = t1;              // 恢复系数 0.45
  for (let k = 0; k < 3; k++) { const T = 2 * v / gpx;
    if (t < ts + T) { const dt = t - ts; return { y: FLOOR - R - (v * dt - .5 * gpx * dt * dt), vy: -(v - gpx * dt), sq: 0 }; }
    ts += T; v *= 0.45; }
  return { y: FLOOR - R, vy: 0, sq: 0 };
}
function squash(t){                                                    // 冲击后挤压，按弹簧回弹（形变来自冲量）
  const d = t - E.impact; if (d < 0) return 0; return (1 - spring(d, 4.0, 0.28)) * 0.38;
}
window.probe = t => { const b = ball(t); return { speed: Math.abs(b.vy), y: b.y }; };   // 给声音用的运动数据

// ---------- 4. 一帧 = t 的纯函数 ----------
const BG = '#F3EFE6', INK = '#22252B', ACC = '#E8613C', BLUE = '#2F4A66';
function draw(ctx, t){
  // 相机：主体先动，相机晚 4 帧再跟（错相）
  const cam = easeInOutCubic(prog(t, E.impact + 4 / C.fps, E.hero + .4));
  const zoom = 1 + 0.08 * cam, shake = Math.exp(-Math.max(0, t - E.impact) * 18) * (t > E.impact ? 6 : 0);
  ctx.save(); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2 + Math.sin(t * 90) * shake); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  // 地面线
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W * .18, FLOOR); ctx.lineTo(W * .82, FLOOR); ctx.stroke();
  // 次级响应：冲击波纹比球晚 2 帧出现、晚 6 帧到峰值
  [0, 0.12, 0.24].forEach((lag, i) => { const p = prog(t, E.impact + 2 / C.fps + lag, E.impact + .9 + lag); if (p <= 0 || p >= 1) return;
    ctx.strokeStyle = i === 0 ? ACC : INK; ctx.globalAlpha = (1 - p) * .8; ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.beginPath(); ctx.ellipse(X0, FLOOR, 60 + 360 * easeOutCubic(p), 10 + 40 * easeOutCubic(p), 0, 0, Math.PI * 2); ctx.stroke(); });
  ctx.globalAlpha = 1;
  // 阴影：比球更晚响应（随高度缩放）
  const b = ball(t), h = clamp((FLOOR - R - b.y) / (FLOOR + R)); ctx.fillStyle = 'rgba(34,37,43,.18)';
  ctx.beginPath(); ctx.ellipse(X0, FLOOR + 4, R * (1.2 - .6 * h), 8 * (1 - .5 * h), 0, 0, Math.PI * 2); ctx.fill();
  // 球：下落时按速度拉伸，冲击时挤压
  const stretch = Math.min(.25, Math.abs(b.vy) / 9000), sq = squash(t);
  const sx = 1 + sq - stretch * .5, sy = 1 - sq + stretch;
  ctx.save(); ctx.translate(X0, b.y + R * (1 - sy)); ctx.scale(sx, sy); ctx.fillStyle = ACC;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // 文字：落地后 0.35 s 入场，easeOutBack 过冲，字间错峰 3 帧
  const txt = '规则开始起作用'; ctx.font = '700 64px "Noto Sans SC","Noto Sans CJK SC",sans-serif'; ctx.textBaseline = 'alphabetic';
  const tw = ctx.measureText(txt).width; let x = W / 2 - tw / 2;
  [...txt].forEach((ch, i) => { const p = prog(t, E.label + i * 3 / C.fps, E.label + i * 3 / C.fps + .45); const w = ctx.measureText(ch).width;
    if (p > 0) { const e = easeOutBack(p); ctx.save(); ctx.globalAlpha = clamp(p * 3); ctx.fillStyle = INK;
      ctx.translate(x + w / 2, H * .3 + (1 - e) * 40); ctx.scale(.6 + .4 * e, .6 + .4 * e); ctx.fillText(ch, -w / 2, 0); ctx.restore(); }
    x += w; });
  // 英雄时刻：一条橙色下划线在 hero 拍点上划出
  const u = easeOutCubic(prog(t, E.hero, E.hero + .35));
  if (u > 0) { ctx.strokeStyle = ACC; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(W / 2 - tw / 2, H * .3 + 24); ctx.lineTo(W / 2 - tw / 2 + tw * u, H * .3 + 24); ctx.stroke(); }
  // 结尾定格的微动：颗粒随时间缓慢漂移（种子固定）
  const r = rng(7); ctx.fillStyle = BLUE;
  for (let i = 0; i < 24; i++) { const px = r() * W, py = r() * FLOOR, ph = r() * 6.28; ctx.globalAlpha = .25 * prog(t, E.settle - .3, E.settle + .3);
    ctx.beginPath(); ctx.arc(px + Math.sin(t * .8 + ph) * 6, py + Math.cos(t * .6 + ph) * 4, 2, 0, 6.28); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
}
// ---------- 5. 对外接口：renderAt(t, 快门子帧数) ----------
window.renderAt = async (t, mb = 1, shutter = 0.5) => {
  if (mb <= 1) { draw(g, t); return; }
  ag.globalCompositeOperation = 'source-over'; ag.fillStyle = '#000'; ag.fillRect(0, 0, W, H);
  ag.globalCompositeOperation = 'lighter'; ag.globalAlpha = 1 / mb;
  for (let i = 0; i < mb; i++) { draw(g, t - shutter / C.fps * (i / mb)); ag.drawImage(cv, 0, 0); }
  ag.globalAlpha = 1; ag.globalCompositeOperation = 'source-over'; g.drawImage(acc, 0, 0);
};
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
